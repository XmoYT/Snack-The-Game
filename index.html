<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Ultimate</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --grid-color: #1a1c28;
            --snake-head: #00ffcc;
            --snake-body: #00ccff;
            --food-color: #ff0055;
            --text-color: #ffffff;
            --accent-glow: rgba(0, 255, 204, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: rgba(20, 22, 37, 0.8);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #score { color: var(--snake-body); text-shadow: 0 0 10px rgba(0, 204, 255, 0.5); }
        #highScore { color: var(--food-color); text-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }

        .canvas-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px var(--accent-glow);
            border: 2px solid var(--snake-head);
        }

        canvas {
            background-color: #05060a;
            display: block;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 14, 21, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .menu-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(45deg, var(--snake-head), var(--snake-body));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, var(--snake-head), var(--snake-body));
            color: #000;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--snake-head);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .controls-hint {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="scoreboard">
            <div class="score-box">Score: <span id="score">0</span></div>
            <div class="score-box">High: <span id="highScore">0</span></div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="menu" class="menu-overlay">
                <h1 id="menuTitle">Neon Snake</h1>
                <button id="startBtn" class="btn">Play Game</button>
                <div class="controls-hint">Use Arrow Keys or WASD to Move</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highScoreElement = document.getElementById("highScore");
        const menu = document.getElementById("menu");
        const menuTitle = document.getElementById("menuTitle");
        const startBtn = document.getElementById("startBtn");

        // Grid configurations
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game state variables
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameInterval = null;
        let gameSpeed = 100; // milliseconds per frame
        let changingDirection = false;

        highScoreElement.textContent = highScore;

        // Event Listeners
        startBtn.addEventListener("click", startGame);
        document.addEventListener("keydown", changeDirection);

        function startGame() {
            // Reset game state
            snake = [
                { x: gridSize * 5, y: gridSize * 10 },
                { x: gridSize * 4, y: gridSize * 10 },
                { x: gridSize * 3, y: gridSize * 10 }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            menu.classList.add("hidden");
            
            generateFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function gameLoop() {
            if (hasGameEnded()) {
                gameOver();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#05060a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                const isHead = index === 0;
                
                // Neon glow effect for the snake
                ctx.shadowBlur = isHead ? 15 : 8;
                ctx.shadowColor = isHead ? "#00ffcc" : "#00ccff";
                
                ctx.fillStyle = isHead ? "#00ffcc" : "#00ccff";
                
                // Rounded blocks for smooth futuristic look
                ctx.beginPath();
                ctx.roundRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2, 4);
                ctx.fill();
            });
            // Reset shadow blur for other elements
            ctx.shadowBlur = 0;
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem("snakeHighScore", highScore);
                }
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;

            // Make sure food doesn't spawn inside the snake
            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) generateFood();
            });
        }

        function drawFood() {
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0055";
            ctx.fillStyle = "#ff0055";
            
            ctx.beginPath();
            ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0; // reset
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const headingUp = dy === -gridSize;
            const headingDown = dy === gridSize;
            const headingRight = dx === gridSize;
            const headingLeft = dx === -gridSize;

            if (changingDirection) return;

            // Arrow keys & WASD keys supported
            if ((keyPressed === 37 || keyPressed === 65) && !headingRight) { // Left / A
                dx = -gridSize; dy = 0; changingDirection = true;
            }
            if ((keyPressed === 38 || keyPressed === 87) && !headingDown) { // Up / W
                dx = 0; dy = -gridSize; changingDirection = true;
            }
            if ((keyPressed === 39 || keyPressed === 68) && !headingLeft) { // Right / D
                dx = gridSize; dy = 0; changingDirection = true;
            }
            if ((keyPressed === 40 || keyPressed === 83) && !headingUp) { // Down / S
                dx = 0; dy = gridSize; changingDirection = true;
            }
            }
            function hasGameEnded() {
            // Self-collision check
            for (let i = 4; i < snake.length; i++) {
            if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            // Wall-collision check
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;
            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
            }
            function gameOver() {
            clearInterval(gameInterval);
            menuTitle.textContent = "Game Over";
            startBtn.textContent = "Try Again";
            menu.classList.remove("hidden");
            }
