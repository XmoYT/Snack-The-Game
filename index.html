<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Neon Snake</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --panel-color: #1a1c28;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-blue: #00f0ff;
            --neon-purple: #bd00ff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            /* Fixed typo here: changed background-radial to background */
            background: radial-gradient(circle at center, #1e2235 0%, #0d0e15 100%);
        }

        #game-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            background: var(--panel-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 800px) {
            #game-container {
                flex-direction: column;
                align-items: center;
            }
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 220px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .stats-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stat-line:last-child {
            margin-bottom: 0;
        }

        .stat-val {
            font-weight: bold;
            color: var(--neon-blue);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #23273a, #11131c);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 13px;
        }

        .menu-btn:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        #canvas-container {
            position: relative;
        }

        canvas {
            background: #090a0f;
            border-radius: 8px;
            border: 2px solid rgba(0, 240, 255, 0.2);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: block;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Sidebar Panel -->
        <div class="side-panel">
            <div class="header">
                <h1>Cyber Snake</h1>
                <div class="stats-box">
                    <div class="stat-line"><span>Score:</span><span id="score" class="stat-val">0</span></div>
                    <div class="stat-line"><span>High Score:</span><span id="high-score" class="stat-val">0</span></div>
                    <div class="stat-line"><span>Speed:</span><span id="speed-lbl" class="stat-val">Normal</span></div>
                </div>
            </div>

            <div class="btn-group">
                <button class="menu-btn" id="start-btn">Start Game</button>
                <button class="menu-btn" id="speed-btn">Difficulty</button>
                <button class="menu-btn" id="reset-btn">Reset</button>
            </div>
        </div>

        <!-- Game Canvas -->
        <div id="canvas-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Elements
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");
        const speedEl = document.getElementById("speed-lbl");
        const startBtn = document.getElementById("start-btn");
        const speedBtn = document.getElementById("speed-btn");
        const resetBtn = document.getElementById("reset-btn");

        // Grid Configuration
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game State Variables
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = 0;
        let gameInterval = null;
        let isPaused = true;
        
        // Speed settings (ms per frame)
        const speeds = { "Easy": 140, "Normal": 90, "Hard": 50 };
        let currentDifficulty = "Normal";

        // Keyboard Controls
        window.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (isPaused) return;
            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === 37 && !goingRight) { dx = -1; dy = 0; }
            if (keyPressed === 38 && !goingDown) { dx = 0; dy = -1; }
            if (keyPressed === 39 && !goingLeft) { dx = 1; dy = 0; }
            if (keyPressed === 40 && !goingUp) { dx = 0; dy = 1; }
        }

        // Main Loop Engine
        function mainLoop() {
            if (hasGameEnded()) {
                alert(`Game Over! Final Score: ${score}`);
                resetGame();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#090a0f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is brighter neon blue, body is neon purple
                ctx.fillStyle = index === 0 ? "#00f0ff" : "#bd00ff";
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0; // Reset shadow
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Check food collision
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                }
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Don't spawn food inside the snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#ff3131"; // Neon red food
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ff3131";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0;
        }

        function hasGameEnded() {
            // Wall collisions
            if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) return true;
            // Self collisions
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        // --- BUTTON LOGIC AND HANDLERS ---

        // Start / Pause Control
        startBtn.addEventListener("click", () => {
            if (isPaused) {
                isPaused = false;
                startBtn.textContent = "Pause";
                // If snake is still stationary, give it an initial direction
                if (dx === 0 && dy === 0) { dx = 1; dy = 0; } 
                gameInterval = setInterval(mainLoop, speeds[currentDifficulty]);
            } else {
                isPaused = true;
                startBtn.textContent = "Resume";
                clearInterval(gameInterval);
            }
        });

        // Difficulty Selector Cycle
        speedBtn.addEventListener("click", () => {
        if (currentDifficulty === "Easy") currentDifficulty = "Normal";
        else if (currentDifficulty === "Normal") currentDifficulty = "Hard";
        else currentDifficulty = "Easy";
        speedEl.textContent = currentDifficulty;
        // Dynamically adjust speed if game is currently playing
        if (!isPaused) {
        clearInterval(gameInterval);
        gameInterval = setInterval(mainLoop, speeds[currentDifficulty]);
        }
        });
        // Reset Engine
        function resetGame() {
        clearInterval(gameInterval);
        snake = [{ x: 10, y: 10 }];
        dx = 0;
        dy = 0;
        score = 0;
        scoreEl.textContent = score;
        isPaused = true;
        startBtn.textContent = "Start Game";
        clearCanvas();
        drawFood();
        drawSnake();
        }
        resetBtn.addEventListener("click", resetGame);
        // Run setup on load
        clearCanvas();
        generateFood();
        drawFood();
        drawSnake();
    </scipt>
</head>
</html>
