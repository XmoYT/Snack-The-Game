<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Browser Snake Game</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 { margin-bottom: 10px; }
        #score { font-size: 24px; margin-bottom: 20px; }
        canvas {
            background-color: #222;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <h1>Snake Game</h1>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20; // 20x20 grid pixels
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }]; // Start in the middle
        let food = { x: 5, y: 5 };
        let dx = 1;  // Horizontal velocity (moving right initially)
        let dy = 0;  // Vertical velocity
        let score = 0;
        let gameInterval;
        const gameSpeed = 1000; // Milliseconds per frame (lower = faster)

        function main() {
            if (hasGameEnded()) {
                alert(`Game Over! Your final score was ${score}.`);
                resetGame();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        // Start the game loop
        resetGame();

        function clearCanvas() {
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#4CAF50"; // Green snake
            snake.forEach(part => {
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function drawFood() {
            ctx.fillStyle = "#FF5252"; // Red food
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function moveSnake() {
            // Create head according to the movement velocities
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Check if head collided with food
            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerText = "Score: " + score;
                generateFood();
            } else {
                snake.pop(); // Remove the tail segment if it didn't eat food
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            // Ensure food doesn't spawn on top of the snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function hasGameEnded() {
            // Wall collisions
            if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) {
                return true;
            }
            // Self collisions
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            food = { x: 5, y: 5 };
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = "Score: " + score;
            clearInterval(gameInterval);
            gameInterval = setInterval(main, gameSpeed);
        }

        // Handle Arrow Key movement
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            // Prevent snake from turning back directly into itself
            if (keyPressed === 37 && !goingRight) { dx = -1; dy = 0; } // Left Arrow
            if (keyPressed === 38 && !goingDown)  { dx = 0; dy = -1; } // Up Arrow
            if (keyPressed === 39 && !goingLeft)  { dx = 1; dy = 0; }  // Right Arrow
            if (keyPressed === 40 && !goingUp)    { dx = 0; dy = 1; }  // Down Arrow
        }
    </script>
</body>
</html>
