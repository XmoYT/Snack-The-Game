<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Neon Snake</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --panel-color: #1a1c28;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-blue: #00f0ff;
            --neon-purple: #bd00ff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-radial: radial-gradient(circle at center, #1e2235 0%, #0d0e15 100%);
        }

        #game-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            background: var(--panel-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 800px) {
            #game-container {
                flex-direction: column;
                align-items: center;
            }
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 220px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .stats-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 15px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stat-line:last-child {
            margin-bottom: 0;
        }

        .stat-val {
            font-weight: bold;
            color: var(--neon-blue);
        }

        .menu-btn {
            background: linear-gradient(135deg, #23273a, #11131c);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            margin-bottom: 10px;
            width: 100%;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-btn:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            transform: translateY(-1px);
        }

        .menu-btn.active {
            border-color: var(--neon-green);
            background: linear-gradient(135deg, rgba(57, 255, 20, 0.1), #11131c);
        }

        .canvas-area {
            position: relative;
            background: #090a0f;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #1f2335;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
        }

        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 14, 21, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s ease;
        }

        #screen-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--neon-green);
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
            text-transform: uppercase;
        }

        .overlay-desc {
            font-size: 14px;
            color: #8a8fbc;
            margin-bottom: 25px;
            text-align: center;
            max-width: 80%;
        }

        .start-action-btn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(189, 0, 255, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .start-action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.6);
        }

        .controls-hint {
            margin-top: auto;
            font-size: 11px;
            color: #565f89;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- LEFT PANEL: MODES & LEVELS -->
        <div class="side-panel">
            <div class="header">
                <h1>Neon Snake</h1>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <div style="font-size: 12px; color: #565f89; margin-left: 5px; font-weight: 600; text-transform: uppercase;">Select Mode</div>
                <button class="menu-btn active" id="btn-endless" onclick="setMode('endless')">
                    <span>Endless</span>
                    <span style="font-size: 10px; color: var(--neon-blue);">∞</span>
                </button>
                <button class="menu-btn" id="btn-l1" onclick="setMode('l1')">
                    <span>Level 1: Box</span>
                    <span style="font-size: 10px; color: #565f89;">Easy</span>
                </button>
                <button class="menu-btn" id="btn-l2" onclick="setMode('l2')">
                    <span>Level 2: Pillars</span>
                    <span style="font-size: 10px; color: #565f89;">Medium</span>
                </button>
                <button class="menu-btn" id="btn-l3" onclick="setMode('l3')">
                    <span>Level 3: Maze</span>
                    <span style="font-size: 10px; color: #565f89;">Hard</span>
                </button>
            </div>

            <div class="controls-hint">
                Use <b>Arrow Keys</b> or <b>WASD</b> to steer.<br>Press <b>Spacebar</b> to pause.
            </div>
        </div>

        <!-- CENTER AREA: CANVAS & SCREEN OVERLAYS -->
        <div class="canvas-area">
            <div id="screen-overlay">
                <div class="overlay-title" id="overlay-text">Cyber Snake</div>
                <div class="overlay-desc" id="overlay-subtext">Choose a level or endless mode and hit start.</div>
                <button class="start-action-btn" id="action-btn" onclick="handleOverlayAction()">Play Game</button>
            </div>
            <canvas id="gameCanvas" width="500" height="500"></canvas>
        </div>

        <!-- RIGHT PANEL: STATS & RECORDS -->
        <div class="side-panel">
            <div>
                <div class="stats-box">
                    <div class="stat-line">
                        <span>Current Score</span>
                        <span class="stat-val" id="current-score" style="color: var(--neon-green);">0</span>
                    </div>
                    <div class="stat-line">
                        <span>Apples Eaten</span>
                        <span class="stat-val" id="apples-eaten">0</span>
                    </div>
                </div>

                <div class="stats-box">
                    <div style="font-size: 12px; color: #8a8fbc; font-weight: 600; margin-bottom: 8px; text-transform: uppercase;">High Scores</div>
                    <div class="stat-line">
                        <span>Endless Mode</span>
                        <span class="stat-val" id="hi-endless">0</span>
                    </div>
                    <div class="stat-line">
                        <span>Level 1</span>
                        <span class="stat-val" id="hi-l1">0</span>
                    </div>
                    <div class="stat-line">
                        <span>Level 2</span>
                        <span class="stat-val" id="hi-l2">0</span>
                    </div>
                    <div class="stat-line">
                        <span>Level 3</span>
                        <span class="stat-val" id="hi-l3">0</span>
                    </div>
                </div>
            </div>

            <button class="menu-btn" style="text-align: center; justify-content: center; margin-bottom: 0; background: #232531; border-color: rgba(255,255,255,0.05);" onclick="resetScores()">
                Reset High Scores
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Grid parameters
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
// State Engines
let snake = [];
let apple = { x: 0, y: 0 };
let velocity = { x: 0, y: 0 };
let nextVelocity = { x: 0, y: 0 };
let obstacles = [];
let score = 0;
let applesCount = 0;
let gameMode = 'endless'; // endless, l1, l2, l3
let gameSpeed = 100; // ms per frame
let gameState = 'menu'; // menu, playing, paused, gameover
let gameLoopId = null;
let animationFrameId = null;
let pulseTime = 0;
// Highscore Repository
let highScores = {
endless: 0,
l1: 0,
l2: 0,
l3: 0
};
// Load existing configurations safely without tracking strings
if (localStorage.getItem('neon_snake_scores')) {
try {
highScores = JSON.parse(localStorage.getItem('neon_snake_scores'));
} catch(e) {}
}
updateHighScoreDisplay();
// Level builder maps
function buildObstacles(mode) {
let list = [];
if (mode === 'l1') {
// Outer ring layout with openings
for (let i = 0; i < tileCount; i++) {
if (i !== 11 && i !== 12 && i !== 13) {
list.push({x: i, y: 0});
list.push({x: i, y: tileCount - 1});
list.push({x: 0, y: i});
list.push({x: tileCount - 1, y: i});
}
}
} else if (mode === 'l2') {
// Four symmetrical central pillar blocks
const pillars = [
{x: 6, y: 6, w: 2, h: 2},
{x: 17, y: 6, w: 2, h: 2},
{x: 6, y: 17, w: 2, h: 2},
{x: 17, y: 17, w: 2, h: 2}
];
pillars.forEach(p => {
for(let dx=0; dx<p.w; dx++) {
for(let dy=0; dy<p.h; dy++) {
list.push({x: p.x + dx, y: p.y + dy});
}
}
});
} else if (mode === 'l3') {
// Advanced Inner Maze Layout
for(let i = 4; i < tileCount - 4; i++) {
list.push({x: i, y: 5});
list.push({x: i, y: tileCount - 6});
}
for(let i = 8; i < tileCount - 8; i++) {
list.push({x: 5, y: i});
list.push({x: tileCount - 6, y: i});
}
}
return list;
}
function setMode(mode) {
if (gameState === 'playing') return; // block change during activity
gameMode = mode;
// UI Button Highlighting Toggle
document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
const activeBtn = document.getElementById(btn-${mode});
if (activeBtn) activeBtn.classList.add('active');
// Set specific velocities or rules per level if desired
if(mode === 'endless') gameSpeed = 80;
else if(mode === 'l1') gameSpeed = 95;
else if(mode === 'l2') gameSpeed = 85;
else if(mode === 'l3') gameSpeed = 75;
resetGameTrack();
updateUI();
}
function resetGameTrack() {
snake = [
{ x: 12, y: 12 },
{ x: 11, y: 12 },
{ x: 10, y: 12 }
];
velocity = { x: 1, y: 0 };
nextVelocity = { x: 1, y: 0 };
score = 0;
applesCount = 0;
obstacles = buildObstacles(gameMode);
spawnApple();
}
function spawnApple() {
while (true) {
let rx = Math.floor(Math.random() * tileCount);
let ry = Math.floor(Math.random() * tileCount);
// Validate spawn target point safety
let conflict = false;
for (let cell of snake) {
if (cell.x === rx && cell.y === ry) conflict = true;
}
for (let obs of obstacles) {
if (obs.x === rx && obs.y === ry) conflict = true;
}
if (!conflict) {
apple = { x: rx, y: ry };
break;
}
}
}
function updateUI() {
document.getElementById('current-score').innerText = score;
document.getElementById('apples-eaten').innerText = applesCount;
const overlay = document.getElementById('screen-overlay');
const title = document.getElementById('overlay-text');
const sub = document.getElementById('overlay-subtext');
const btn = document.getElementById('action-btn');
if (gameState === 'menu') {
overlay.classList.remove('hidden');
title.innerText = "Neon Snake";
title.style.color = "var(--neon-blue)";
title.style.textShadow = "0 0 15px rgba(0, 240, 255, 0.5)";
sub.innerText = "Navigate the cyber grid. Dodge obstacles and yourself.";
btn.innerText = "Launch Simulation";
} else if (gameState === 'paused') {
overlay.classList.remove('hidden');
title.innerText = "Simulation Paused";
title.style.color = "var(--neon-purple)";
title.style.textShadow = "0 0 15px rgba(189, 0, 255, 0.5)";
sub.innerText = Current score accumulated: ${score};
btn.innerText = "Resume Game";
} else if (gameState === 'gameover') {
overlay.classList.remove('hidden');
title.innerText = "System Failure";
title.style.color = "var(--neon-red)";
title.style.textShadow = "0 0 15px rgba(255, 49, 49, 0.5)";
sub.innerText = Crash detected. Final Score: ${score} | Apples: ${applesCount};
btn.innerText = "Reboot Grid";
} else {
overlay.classList.add('hidden');
}
}
function handleOverlayAction() {
if (gameState === 'menu' || gameState === 'gameover') {
resetGameTrack();
gameState = 'playing';
updateUI();
startGameLoop();
} else if (gameState === 'paused') {
gameState = 'playing';
updateUI();
startGameLoop();
}
}
function togglePause() {
if (gameState === 'playing') {
gameState = 'paused';
stopGameLoop();
updateUI();
} else if (gameState === 'paused') {
gameState = 'playing';
updateUI();
startGameLoop();
}
}
function startGameLoop() {
stopGameLoop();
gameLoopId = setInterval(tick, gameSpeed);
}
function stopGameLoop() {
if (gameLoopId) clearInterval(gameLoopId);
}
// Action Tick Engine Execution Step
function tick() {
velocity = nextVelocity;
// Compute tentative next head location
let headX = snake[0].x + velocity.x;
let headY = snake[0].y + velocity.y;
// Endless mode screen wrap vs traditional level wall collision boundary check
if (gameMode === 'endless') {
if (headX < 0) headX = tileCount - 1;
if (headX >= tileCount) headX = 0;
if (headY < 0) headY = tileCount - 1;
if (headY >= tileCount) headY = 0;
} else {
if (headX < 0 || headX >= tileCount || headY < 0 || headY >= tileCount) {
triggerGameOver();
return;
}
}
// Self and obstruction intersection checking checks
const nextHead = { x: headX, y: headY };
for (let cell of snake) {
if (cell.x === nextHead.x && cell.y === nextHead.y) {
triggerGameOver();
return;
}
}
for (let obs of obstacles) {
if (obs.x === nextHead.x && obs.y === nextHead.y) {
triggerGameOver();
return;
}
}
// Prepend new head point position
snake.unshift(nextHead);
// Harvest evaluation check
if (nextHead.x === apple.x && nextHead.y === apple.y) {
score += (gameMode === 'endless') ? 10 : 15;
applesCount++;
// dynamic speed scaling system logic
if (gameMode === 'endless' && applesCount % 5 === 0 && gameSpeed > 40) {
gameSpeed -= 4;
startGameLoop();
}
spawnApple();
checkHighScore();
} else {
snake.pop();
}
document.getElementById('current-score').innerText = score;
document.getElementById('apples-eaten').innerText = applesCount;
}
function triggerGameOver() {
gameState = 'gameover';
stopGameLoop();
checkHighScore();
updateUI();
}
function checkHighScore() {
if (score > highScores[gameMode]) {
highScores[gameMode] = score;
localStorage.setItem('neon_snake_scores', JSON.stringify(highScores));
updateHighScoreDisplay();
}
}
function updateHighScoreDisplay() {
document.getElementById('hi-endless').innerText = highScores.endless;
document.getElementById('hi-l1').innerText = highScores.l1;
document.getElementById('hi-l2').innerText = highScores.l2;
document.getElementById('hi-l3').innerText = highScores.l3;
}
function resetScores() {
highScores = { endless: 0, l1: 0, l2: 0, l3: 0 };
localStorage.setItem('neon_snake_scores', JSON.stringify(highScores));
updateHighScoreDisplay();
}
// Input Processor Hook Up Map
window.addEventListener('keydown', e => {
const key = e.key.toLowerCase();
if (e.key === ' ') {
e.preventDefault();
togglePause();
return;
}
if (gameState !== 'playing') return;
if ((key === 'arrowup' || key === 'w') && velocity.y === 0) { nextVelocity = { x: 0, y: -1 }; e.preventDefault(); }
else if ((key === 'arrowdown' || key === 's') && velocity.y === 0) { nextVelocity = { x: 0, y: 1 }; e.preventDefault(); }
else if ((key === 'arrowleft' || key === 'a') && velocity.x === 0) { nextVelocity = { x: -1, y: 0 }; e.preventDefault(); }
else if ((key === 'arrowright' || key === 'd') && velocity.x === 0) { nextVelocity = { x: 1, y: 0 }; e.preventDefault(); }
});
// High Visual Graphics Animation Engine Render System Loop
function render() {
pulseTime += 0.05;
ctx.clearRect(0, 0, canvas.width, canvas.height);
// Draw technical grid background lines softly
ctx.strokeStyle = 'rgba(255, 255, 255, 0.015)';
ctx.lineWidth = 1;
for (let i = 0; i < tileCount; i++) {
ctx.beginPath();
ctx.moveTo(i * gridSize, 0);
ctx.lineTo(i * gridSize, canvas.height);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(0, i * gridSize);
ctx.lineTo(canvas.width, i * gridSize);
ctx.stroke();
}
// Render configured stationary internal static level wall structures
obstacles.forEach(obs => {
ctx.fillStyle = '#1e2433';
ctx.fillRect(obs.x * gridSize + 1, obs.y * gridSize + 1, gridSize - 2, gridSize - 2);
ctx.strokeStyle = '#ff0055';
ctx.lineWidth = 1.5;
ctx.strokeRect(obs.x * gridSize + 2, obs.y * gridSize + 2, gridSize - 4, gridSize - 4);
});
// Render Apple with a dynamic glowing pulse element
let applePulse = Math.sin(pulseTime * 2) * 2;
let rad = (gridSize / 2 - 2) + applePulse * 0.4;
let ax = apple.x * gridSize + gridSize / 2;
let ay = apple.y * gridSize + gridSize / 2;
ctx.shadowBlur = 12 + applePulse * 3;
ctx.shadowColor = varColor('--neon-red');
ctx.fillStyle = varColor('--neon-red');
ctx.beginPath();
ctx.arc(ax, ay, Math.max(3, rad), 0, Math.PI * 2);
ctx.fill();
// Apple leaf feature detail line accent
ctx.shadowBlur = 0;
ctx.strokeStyle = varColor('--neon-green');
ctx.lineWidth = 1.5;
ctx.beginPath();
ctx.moveTo(ax, ay - rad);
ctx.quadraticCurveTo(ax + 3, ay - rad - 4, ax + 5, ay - rad - 3);
ctx.stroke();
// Render Cyber Snake System
for (let i = 0; i < snake.length; i++) {
let cell = snake[i];
let isHead = (i === 0);
// Color morphing gradients down snake spinal cord length segment chains
let segmentRatio = i / snake.length;
ctx.fillStyle = isHead ? varColor('--neon-green') : blendColors(varColor('--neon-green'), varColor('--neon-blue'), segmentRatio);
ctx.shadowBlur = isHead ? 12 : 4;
ctx.shadowColor = ctx.fillStyle;
let padding = isHead ? 1 : 2;
let size = gridSize - padding * 2;
let rx = cell.x * gridSize + padding;
let ry = cell.y * gridSize + padding;
// Draw segments with subtle rounded cyber architecture style look
drawRoundedRect(ctx, rx, ry, size, size, isHead ? 5 : 3);
// Technical internal HUD decoration dots mapped inside head block
if (isHead) {
ctx.shadowBlur = 0;
ctx.fillStyle = '#000000';
// Eyes layout positioning depends on directional velocity offset
let eyeOffset1 = {x: 5, y: 5};
let eyeOffset2 = {x: 13, y: 5};
if (velocity.x !== 0) {
eyeOffset1 = {x: 10, y: 5};
eyeOffset2 = {x: 10, y: 13};
}
ctx.fillRect(cell.x * gridSize + eyeOffset1.x, cell.y * gridSize + eyeOffset1.y, 3, 3);
ctx.fillRect(cell.x * gridSize + eyeOffset2.x, cell.y * gridSize + eyeOffset2.y, 3, 3);
}
}
// Restore canvas states for performance tracking
ctx.shadowBlur = 0;
animationFrameId = requestAnimationFrame(render);
}
// Helper design toolkit scripts
function varColor(variable) {
return getComputedStyle(document.documentElement).getPropertyValue(variable).trim();
}
function blendColors(c1, c2, weight) {
// Simplistic fast lookups for theme static colors safely
let parse = (str) => {
if(str.startsWith('#')) {
if(str.length === 4) return [parseInt(str+str,16), parseInt(str[2]+str[2],16), parseInt(str[3]+str[3, 16)];
return [parseInt(str.slice(1,3),16), parseInt(str.slice(3,5),16), parseInt(str.slice(5,7),16)];
}
return [57, 255, 14];
};
let p1 = parse(c1), p2 = parse(c2);
let r = Math.round(p1[0] * (1 - weight) + p2[0] * weight);
let g = Math.round(p1 * (1 - weight) + p2 * weight);
let b = Math.round(p1[2] * (1 - weight) + p2[2] * weight);
return rgb(${r},${g},${b});
}
function drawRoundedRect(canvasCtx, x, y, width, height, radius) {
canvasCtx.beginPath();
canvasCtx.moveTo(x + radius, y);
canvasCtx.lineTo(x + width - radius, y);
canvasCtx.quadraticCurveTo(x + width, y, x + width, y + radius);
canvasCtx.lineTo(x + width, y + height - radius);
canvasCtx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
canvasCtx.lineTo(x + radius, y + height);
canvasCtx.quadraticCurveTo(x, y + height, x, y + height - radius);
canvasCtx.lineTo(x, y + radius);
canvasCtx.quadraticCurveTo(x, y, x + radius, y);
canvasCtx.closePath();
canvasCtx.fill();
}
// Bootstrap init execution hook
setMode('endless');
render();
