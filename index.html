<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Arcade Snake</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-color: #161b22;
            --accent-color: #58a6ff;
            --snake-color: #39d353;
            --food-color: #f85149;
            --text-color: #c9d1d9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--panel-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
            max-width: 100%;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        #bestScore {
            color: var(--accent-color);
        }

        canvas {
            background-color: #010409;
            border: 2px solid #30363d;
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
        }

        #startButton {
            background-color: var(--snake-color);
            color: #04210a;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, background-color 0.2s;
            width: 100%;
            max-width: 400px;
        }

        #startButton:active {
            transform: scale(0.98);
        }

        /* Mobile Controls Layout */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            width: 220px;
            margin-top: 20px;
        }

        .dbtn {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            color: var(--text-color);
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .dbtn:active {
            background: #30363d;
            color: white;
        }

        #btnUp { grid-column: 2; grid-row: 1; }
        #btnLeft { grid-column: 1; grid-row: 2; }
        #btnRight { grid-column: 3; grid-row: 2; }
        #btnDown { grid-column: 2; grid-row: 3; }

        /* Hide D-Pad completely on desktop desktops */
        @media (min-width: 768px) {
            .dpad {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="scoreboard">
            <div class="score-box">Score: <span id="currentScore">0</span></div>
            <div class="score-box">Best: <span id="bestScore">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <button id="startButton">Start Game</button>

        <!-- On-screen Controls for Mobile Users -->
        <div class="dpad">
            <button class="dbtn" id="btnUp">▲</button>
            <button class="dbtn" id="btnLeft">◀</button>
            <button class="dbtn" id="btnRight">▶</button>
            <button class="dbtn" id="btnDown">▼</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startButton = document.getElementById("startButton");
        const currentScoreEl = document.getElementById("currentScore");
        const bestScoreEl = document.getElementById("bestScore");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1; 
        let dy = 0; 
        let score = 0;
        let bestScore = parseInt(localStorage.getItem("snake_best_score")) || 0;
        let gameInterval = null;
        let gameRunning = false;

        // Display the loaded best score immediately
        bestScoreEl.innerText = bestScore;

        function main() {
            if (hasGameEnded()) {
                handleGameOver();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        // Render clean layout state on load
        clearCanvas();
        drawSnake();
        drawFood();

        startButton.addEventListener("click", () => {
            if (!gameRunning) startGame();
        });

        function startGame() {
            resetGameLogic();
            gameRunning = true;
            startButton.innerText = "Restart Game";
            startButton.blur(); 
            gameInterval = setInterval(main, 100);
        }

        function resetGameLogic() {
            clearInterval(gameInterval);
            gameRunning = false;
            startButton.innerText = "Start Game";
            snake = [{ x: 10, y: 10 }];
            food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
            dx = 1;
            dy = 0;
            score = 0;
            currentScoreEl.innerText = score;
        }

        function handleGameOver() {
            clearInterval(gameInterval);
            gameRunning = false;
            
            // Check for new personal high score
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem("snake_best_score", bestScore);
                bestScoreEl.innerText = bestScore;
                alert(`🎉 New High Score! You scored ${score}!`);
            } else {
                alert(`Game Over! Your final score is ${score}`);
            }
            
            resetGameLogic();
        }

        function clearCanvas() {
            ctx.fillStyle = "#010409";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is brighter, body is standard snake green
                ctx.fillStyle = index === 0 ? "#56f071" : "#39d353";
                // Rounded blocks using padding math
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                currentScoreEl.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function drawFood() {
            ctx.fillStyle = "#f85149";
            // Draw food slightly smaller and centered
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function hasGameEnded() {
            const head = snake[0];
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return true;
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }

        // Directional handling helper logic
        function changeDirection(direction) {
            if (!gameRunning) return;
            if (direction === "UP" && dy !== 1) { dx = 0; dy = -1; }
            if (direction === "DOWN" && dy !== -1) { dx = 0; dy = 1; }
            if (direction === "LEFT" && dx !== 1) { dx = -1; dy = 0; }
            if (direction === "RIGHT" && dx !== -1) { dx = 1; dy = 0; }
        }

        // Physical Keyboard Event Listeners
        document.addEventListener("keydown", event => {
            const keyPressed = event.key;
            if (keyPressed === "ArrowUp") changeDirection("UP");
            if (keyPressed === "ArrowDown") changeDirection("DOWN");
            if (keyPressed === "ArrowLeft") changeDirection("LEFT");
            if (keyPressed === "ArrowRight") changeDirection("RIGHT");
        });

        // Mobile D-Pad Touch Listeners
        document.getElementById("btnUp").addEventListener("click", () => changeDirection("UP"));
        document.getElementById("btnDown").addEventListener("click", () => changeDirection("DOWN"));
        document.getElementById("btnLeft").addEventListener("click", () => changeDirection("LEFT"));
        document.getElementById("btnRight").addEventListener("click", () => changeDirection("RIGHT"));
